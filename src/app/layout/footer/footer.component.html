<ng-container *transloco="let t">
  <footer class="py-10 px-4 sm:px-6 lg:px-8"
    style="background-color: var(--bg-secondary); border-top: 1px solid var(--border-color);">
    <div class="max-w-screen-2xl mx-auto">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-6">
        <div class="text-center sm:text-left">
          <a [routerLink]="['/', currentLang]" class="text-2xl font-bold tracking-tight"
            style="color: var(--text-primary);">
            HACKERUNA
          </a>
          <p class="text-xs font-mono mt-1" style="color: var(--accent-blue);">
            &lt;/&gt; dev · ai-native · security
          </p>
        </div>

        <div class="flex items-center space-x-4">
          <!-- Facebook -->
          <a href="https://www.facebook.com/hackeruna" target="_blank" rel="noopener noreferrer"
            class="hover:opacity-70 transition-opacity" style="color: var(--text-secondary);" aria-label="Facebook">
            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path fill-rule="evenodd"
                d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"
                clip-rule="evenodd" />
            </svg>
          </a>

          <!-- Twitter/X -->
          <a href="https://twitter.com/hackeruna" target="_blank" rel="noopener noreferrer"
            class="hover:opacity-70 transition-opacity" style="color: var(--text-secondary);" aria-label="Twitter">
            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 012.8 9.71v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84" />
            </svg>
          </a>

          <!-- LinkedIn -->
          <a href="https://www.linkedin.com/in/juanitourquiza" target="_blank" rel="noopener noreferrer"
            class="hover:opacity-70 transition-opacity" style="color: var(--text-secondary);" aria-label="LinkedIn">
            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path fill-rule="evenodd"
                d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
                clip-rule="evenodd" />
            </svg>
          </a>

          <!-- GitHub -->
          <a href="https://github.com/juanitourquiza/" target="_blank" rel="noopener noreferrer"
            class="hover:opacity-70 transition-opacity" style="color: var(--text-secondary);" aria-label="GitHub">
            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path fill-rule="evenodd"
                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                clip-rule="evenodd" />
            </svg>
          </a>

          <!-- YouTube -->
          <a href="https://www.youtube.com/juanitourquiza" target="_blank" rel="noopener noreferrer"
            class="hover:opacity-70 transition-opacity" style="color: var(--text-secondary);" aria-label="YouTube">
            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
            </svg>
          </a>

          <!-- Spotify -->
          <a href="https://open.spotify.com/show/0ifNrkBCtqYS42zg1Eben9" target="_blank" rel="noopener noreferrer"
            class="hover:opacity-70 transition-opacity" style="color: var(--text-secondary);" aria-label="Spotify">
            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z" />
            </svg>
          </a>
        </div>
      </div>

      <div
        class="mt-8 pt-8 flex flex-col-reverse md:flex-row justify-between items-center space-y-4 md:space-y-0 text-center md:text-left"
        style="border-top: 1px solid var(--border-color);">
        <div class="flex flex-col md:flex-row items-center gap-3">
          <p class="text-sm" style="color: var(--text-tertiary);">
            © {{ currentYear }} Hackeruna.com. {{ t('footer.copyright') }}.
          </p>
          <span class="text-xs px-2 py-1 rounded"
            style="background-color: var(--bg-tertiary); color: var(--text-tertiary); font-family: 'Roboto Mono', monospace;">
            v{{ version }}
          </span>
        </div>

        <nav class="flex flex-wrap justify-center gap-x-6 gap-y-2">
          <a [routerLink]="['/', currentLang, 'privacy']" class="text-sm hover:opacity-70 transition-opacity"
            style="color: var(--text-secondary);">
            {{ t('footer.privacy') }}
          </a>
          <a [routerLink]="['/', currentLang, 'terms']" class="text-sm hover:opacity-70 transition-opacity"
            style="color: var(--text-secondary);">
            {{ t('footer.terms') }}
          </a>
        </nav>
      </div>
    </div>
  </footer>
</ng-container>
